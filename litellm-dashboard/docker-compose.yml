version: "3.9"

# 一键启动 LiteLLM + Tracker + Dashboard
# 用法:
#   cp .env.example .env   # 然后编辑 .env 填入你的 OpenAI Key
#   docker compose up -d
#
# 启动后:
#   - 面板:        http://localhost:8080
#   - LiteLLM 入口: http://localhost:4000
#   - Tracker API: http://localhost:8000/docs

services:
  # ---------------- Tracker (小账本) ----------------
  tracker:
    build: ./tracker
    container_name: litellm-tracker
    restart: unless-stopped
    environment:
      DB_PATH: /data/usage.db
      BUDGETS_PATH: /app/budgets.yaml
    volumes:
      - tracker-data:/data
      - ./tracker/budgets.yaml:/app/budgets.yaml:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;urllib.request.urlopen('http://localhost:8000/health',timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5

  # ---------------- LiteLLM Proxy ----------------
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-proxy
    restart: unless-stopped
    depends_on:
      tracker:
        condition: service_healthy
    environment:
      # OpenAI Key（从 .env 注入）
      OPENAI_API_KEY_1: ${OPENAI_API_KEY_1}
      OPENAI_API_KEY_2: ${OPENAI_API_KEY_2}
      # 客户端连 LiteLLM 用的 master key
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # callback 把数据发到哪里（容器间用 service 名）
      TRACKER_URL: http://tracker:8000
      # 让 LiteLLM 能 import 到我们的 callback_handler.py
      PYTHONPATH: /app/custom
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm:/app/custom:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    ports:
      - "4000:4000"

  # ---------------- Dashboard (前端) ----------------
  dashboard:
    image: nginx:1.27-alpine
    container_name: litellm-dashboard
    restart: unless-stopped
    depends_on:
      - tracker
    volumes:
      - ./dashboard/public:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  tracker-data:
